name: Crawl directory and deploy Pages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, feat/diverss-mvp]
    paths:
      - 'web/**'
      - 'data/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/crawl-and-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Crawl directory feeds
        run: |
          mkdir -p web/public/data
          go run ./cmd/diverss-crawl -directory data/directory.json -out web/public/data/scores.json
          cp data/directory.json web/public/data/directory.json
          cp data/categories.json web/public/data/categories.json
          cp data/sources.json web/public/data/sources.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build-only

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: crawl-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
