name: Crawl directory and deploy Vercel

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, feat/diverss-mvp]
    paths:
      - 'web/**'
      - 'api/**'
      - 'workers/score/**'
      - 'data/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'vercel.json'
      - '.github/workflows/crawl-and-pages.yml'

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Crawl directory feeds
        run: |
          mkdir -p web/public/data
          go run ./cmd/gardenrss-crawl -directory data/directory.json -out web/public/data/scores.json
          cp data/directory.json web/public/data/directory.json
          cp data/categories.json web/public/data/categories.json
          cp data/sources.json web/public/data/sources.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            workers/score/package-lock.json

      - name: Install dependencies
        run: |
          cd workers/score && npm ci
          cd ../../web && npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build-only

      - name: Install Vercel CLI
        if: github.ref == 'refs/heads/main'
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
