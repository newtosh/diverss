<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-plant.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Static, not just the JS-set one in theme.ts: Safari picks the
         status bar's tint at initial paint, before Vue mounts and can set
         theme-color dynamically — by then it's too late to change what
         already rendered. These match gr-surface's default light/dark
         values; theme.ts keeps it correct after a manual theme toggle. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFBF3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2B2216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GardenRSS" />
    <title>GardenRSS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
